name: Refresh profile statistics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "scripts/update_stats.py"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read public GitHub data and render the panels
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python scripts/update_stats.py
      - name: Commit the refreshed panels and cache key
        run: |
          if [ -z "$(git status --porcelain -- README.md assets/activity-dark.svg assets/activity-light.svg)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/activity-dark.svg assets/activity-light.svg
          git commit -m "chore: refresh live profile statistics"
          git push
