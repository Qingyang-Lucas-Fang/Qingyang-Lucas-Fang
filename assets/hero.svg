<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="456" viewBox="0 0 1200 456" role="img" aria-labelledby="title desc">
<title id="title">Lucas Fang — from silicon to software</title><desc id="desc">Hardware–software co-design, GPU compilers, and AI systems. An animated circuit connects software and a processor.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#263742" stroke-width="0.7"/></pattern>
  <linearGradient id="shade"><stop stop-color="#101820"/><stop offset="1" stop-color="#15252E"/></linearGradient>
  <linearGradient id="trace"><stop stop-color="#9BF0CD" stop-opacity="0.1"/><stop offset="1" stop-color="#9BF0CD"/></linearGradient>
</defs>
<style>
  .signal { stroke-dasharray: 7 110; animation: travel 7s linear infinite; }
  .pulse { animation: breathe 5s ease-in-out infinite; }
