<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="348" viewBox="0 0 1200 348" role="img" aria-labelledby="title desc">
<title id="title">OpenAssembler v0.3.0 — GPU compiler engineering</title><desc id="desc">OpenAssembler v0.3.0 is a native-first NVIDIA SM80 compiler and research platform with bounded parallel native builds, tensor-kernel experiments, cooperative FP32 reductions, and explicit application workflows. Experimental schedule improvements are shape-specific and do not establish universal speedups.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#D8D6EA" stroke-width="0.8"/></pattern>
  <linearGradient id="shade"><stop stop-color="#FFF8DB"/><stop offset="0.58" stop-color="#FFFDF8"/><stop offset="1" stop-color="#F0EEFF"/></linearGradient>
  <linearGradient id="trace"><stop stop-color="#72B9D8" stop-opacity="0.2"/><stop offset="1" stop-color="#8A78D6"/></linearGradient>
</defs>
<style>
  .signal { stroke-dasharray: 7 110; animation: travel 7s linear infinite; }
  .pulse { animation: breathe 5s ease-in-out infinite; }
  @keyframes travel { to { stroke-dashoffset: -234; } }
  @keyframes breathe { 0%,100% {opacity:.4} 50% {opacity:1} }
  @media (prefers-reduced-motion: reduce) { .signal,.pulse { animation: none !important; } }
</style>
