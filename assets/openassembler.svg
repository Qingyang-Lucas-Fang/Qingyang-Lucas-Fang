<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="348" viewBox="0 0 1200 348" role="img" aria-labelledby="title desc">
<title id="title">OpenAssembler — GPU compiler engineering</title><desc id="desc">A custom PTX-to-SASS compiler backend for Ampere. Project-reported results: 1.36 times speedup on the div7 loop benchmark versus ptxas, 110 of 110 compiled probes bit-exact on A100, and 97 exactly verified matrix multiplication factorizations.</desc>
