<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="348" viewBox="0 0 1200 348" role="img" aria-labelledby="title desc">
<title id="title">Grand Tool — prompt to design to demo</title><desc id="desc">A local AI UI design workflow. Prompt and context become a blueprint, then a Pencil MCP design, a review with a human checkpoint, and an HTML or React demo. The diagram is conceptual, not a product screenshot.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#263742" stroke-width="0.7"/></pattern>
  <linearGradient id="shade"><stop stop-color="#101820"/><stop offset="1" stop-color="#15252E"/></linearGradient>
  <linearGradient id="trace"><stop stop-color="#9BF0CD" stop-opacity="0.1"/><stop offset="1" stop-color="#9BF0CD"/></linearGradient>
</defs>
<style>
  .signal { stroke-dasharray: 7 110; animation: travel 7s linear infinite; }
  .pulse { animation: breathe 5s ease-in-out infinite; }
  @keyframes travel { to { stroke-dashoffset: -234; } }
  @keyframes breathe { 0%,100% {opacity:.4} 50% {opacity:1} }
  @media (prefers-reduced-motion: reduce) { .signal,.pulse { animation: none !important; } }
</style>
